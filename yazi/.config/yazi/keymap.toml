# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
"schema" = "https://yazi-rs.github.io/schemas/keymap.json"

# ─────────────────────────────────────────────────────────────
# Navigation — tabs, relative jumps, smarter l/F
# ─────────────────────────────────────────────────────────────

[[mgr.prepend_keymap]]
on   = "H"
run  = "tab_switch -1 --relative"
desc = "Switch to previous tab"

[[mgr.prepend_keymap]]
on   = "L"
run  = "tab_switch 1 --relative"
desc = "Switch to next tab"

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin smart-filter"
desc = "Smart filter"

# swapped from yazi's defaults (z = fzf, Z = zoxide)
[[mgr.prepend_keymap]]
on   = "z"
run  = "plugin zoxide"
desc = "Jump to a directory via zoxide"

[[mgr.prepend_keymap]]
on   = "Z"
run  = "plugin fzf"
desc = "Jump to a file/directory via fzf"

# relative-motions: press a digit then a motion (e.g. 5j) to jump N lines
[[mgr.prepend_keymap]]
on   = ["1"]
run  = "plugin relative-motions 1"
desc = "Move in relative steps"

[[mgr.prepend_keymap]]
on   = ["2"]
run  = "plugin relative-motions 2"
desc = "Move in relative steps"

[[mgr.prepend_keymap]]
on   = ["3"]
run  = "plugin relative-motions 3"
desc = "Move in relative steps"

[[mgr.prepend_keymap]]
on   = ["4"]
run  = "plugin relative-motions 4"
desc = "Move in relative steps"

[[mgr.prepend_keymap]]
on   = ["5"]
run  = "plugin relative-motions 5"
desc = "Move in relative steps"

[[mgr.prepend_keymap]]
on   = ["6"]
run  = "plugin relative-motions 6"
desc = "Move in relative steps"

[[mgr.prepend_keymap]]
on   = ["7"]
run  = "plugin relative-motions 7"
desc = "Move in relative steps"

[[mgr.prepend_keymap]]
on   = ["8"]
run  = "plugin relative-motions 8"
desc = "Move in relative steps"

[[mgr.prepend_keymap]]
on   = ["9"]
run  = "plugin relative-motions 9"
desc = "Move in relative steps"

# ─────────────────────────────────────────────────────────────
# Quick jump — fixed directories under the "b" prefix
# ─────────────────────────────────────────────────────────────

[[mgr.prepend_keymap]]
on   = ["b", "g"]
run  = "cd ~/Games"
desc = "Go to ~/Games"

[[mgr.prepend_keymap]]
on   = ["b", "D"]
run  = "cd ~/Dotfiles"
desc = "Go to ~/Dotfiles"

[[mgr.prepend_keymap]]
on   = ["b", "d"]
run  = "cd ~/Downloads"
desc = "Go to ~/Downloads"

[[mgr.prepend_keymap]]
on   = ["b", "p"]
run  = "cd ~/Pictures"
desc = "Go to ~/Pictures"

[[mgr.prepend_keymap]]
on   = ["b", "c"]
run  = "cd ~/Code"
desc = "Go to ~/Code"

[[mgr.prepend_keymap]]
on   = ["b", "t"]
run  = "plugin recycle-bin open"
desc = "Go to Trash"

# ─────────────────────────────────────────────────────────────
# Bookmarks — bookmarks.yazi plugin
# ─────────────────────────────────────────────────────────────

[[mgr.prepend_keymap]]
on   = ["m"]
run  = "plugin bookmarks save"
desc = "Save current position as a bookmark"

[[mgr.prepend_keymap]]
on   = ["'"]
run  = "plugin bookmarks jump"
desc = "Jump to a bookmark"

[[mgr.prepend_keymap]]
on   = ["b", "x"]
run  = "plugin bookmarks delete"
desc = "Delete a bookmark"

[[mgr.prepend_keymap]]
on   = ["b", "X"]
run  = "plugin bookmarks delete_all"
desc = "Delete all bookmarks"

# ─────────────────────────────────────────────────────────────
# File operations — permissions, mounting
# ─────────────────────────────────────────────────────────────

[[mgr.prepend_keymap]]
on   = ["c", "m"]
run  = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]
on   = "M"
run  = "plugin mount"
desc = "Mount / unmount devices"

# ─────────────────────────────────────────────────────────────
# Trash — recycle-bin plugin
# ─────────────────────────────────────────────────────────────

[[mgr.prepend_keymap]]
on   = ["g", "t"]
run  = "plugin recycle-bin open"
desc = "Go to Trash"

[[mgr.prepend_keymap]]
on   = ["T", "o"]
run  = "plugin recycle-bin open"
desc = "Open Trash"

[[mgr.prepend_keymap]]
on   = ["T", "e"]
run  = "plugin recycle-bin empty"
desc = "Empty Trash"

[[mgr.prepend_keymap]]
on   = ["T", "d"]
run  = "plugin recycle-bin delete"
desc = "Delete from Trash"

[[mgr.prepend_keymap]]
on   = ["T", "D"]
run  = "plugin recycle-bin emptyDays"
desc = "Empty by days deleted"

[[mgr.prepend_keymap]]
on   = ["T", "r"]
run  = "plugin recycle-bin restore"
desc = "Restore from Trash"

# ─────────────────────────────────────────────────────────────
# Clipboard / drag & drop
# ─────────────────────────────────────────────────────────────

[[mgr.prepend_keymap]]
on   = "Y"
run  = "plugin wl-clipboard"
desc = "Copy file(s) to Wayland clipboard"

[[mgr.prepend_keymap]]
on   = "<C-n>"
run  = 'shell -- dragon-drop -x -i -T "$1"'
desc = "Drag and drop via dragon-drop"

# ─────────────────────────────────────────────────────────────
# Archives — compress plugin (all under the "c a" prefix)
# ─────────────────────────────────────────────────────────────

[[mgr.prepend_keymap]]
on   = ["c", "a", "7"]
run  = "plugin compress .7z"
desc = "Archive selected files with 7zip"

[[mgr.prepend_keymap]]
on   = ["c", "a", "z"]
run  = "plugin compress 'tar.zst'"
desc = "Archive selected files with tar zstd"

[[mgr.prepend_keymap]]
on   = ["c", "a", "a"]
run  = "plugin compress .zip"
desc = "Archive selected files with zip"

[[mgr.prepend_keymap]]
on   = ["c", "a", "p"]
run  = "plugin compress -p"
desc = "Archive selected files (password)"

[[mgr.prepend_keymap]]
on   = ["c", "a", "h"]
run  = "plugin compress -ph"
desc = "Archive selected files (password+header)"

[[mgr.prepend_keymap]]
on   = ["c", "a", "l"]
run  = "plugin compress -l"
desc = "Archive selected files (compression level)"

[[mgr.prepend_keymap]]
on   = ["c", "a", "u"]
run  = "plugin compress -phl"
desc = "Archive selected files (password+header+level)"
